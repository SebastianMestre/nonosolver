<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>custom puzzle</title>
  <link rel="stylesheet" href="./src/pages/style.css">
</head>
<body>
  <div id="toolbar">
    <a href="./index.html">All puzzles</a>
    <div id="rule-list"></div>
    <button type="button" id="step">Step</button>
    <button type="button" id="converge">To convergence</button>
    <button type="button" id="clear">Clear</button>
    <span id="hint">left click paints, right click crosses</span>
    <span id="status"></span>
  </div>
  <form id="clue-form">
    <div class="sizes">
      <label>Width <input id="width" type="number" min="1" max="80" value="2" required></label>
      <label>Height <input id="height" type="number" min="1" max="80" value="2" required></label>
      <button type="submit">Show</button>
    </div>
    <label>Rows
      <textarea id="rows" spellcheck="false">1 1
3</textarea>
    </label>
    <label>Columns
      <textarea id="cols" spellcheck="false">1
3</textarea>
    </label>
    <span id="form-hint">One line per row or column. Separate numbers with spaces. A blank line has no clues.</span>
    <span id="form-error"></span>
  </form>
  <div id="board"><canvas id="canvas"></canvas></div>
  <script type="module" src="./src/pages/custom.js"></script>
</body>
</html>
